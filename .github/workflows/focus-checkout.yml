name: Prepare native focus implementation
on:
  push:
    branches: [fix/website-menu-initial-focus]
    paths: [.github/workflows/focus-checkout.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and prepare the exact focus-only source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/octojoom)" = adbe00800249b229217ef8ed615feb00f7534e27
          git apply --check .github/website-focus.patch
          git apply .github/website-focus.patch
          echo '7a131a254e6eea0c05568a8a6ac96bf255dd6bd0d7284c8f84763c90e451dc18  src/octojoom' | sha256sum --check
          bash -n src/octojoom
          git diff --check
          jq -n --rawfile content src/octojoom '{content:$content,encoding:"utf-8"}' > "$RUNNER_TEMP/source.json"
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/source.json" --jq .sha)
          test "$blob" = ec2f5287a2ab6a08ecbe85f9a2e541a9c2f24dd2
          printf 'SOURCE_BLOB=%s\n' "$blob"
