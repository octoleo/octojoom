name: Prepare storage regression fixture
on:
  push:
    branches: [fix/website-menu-initial-focus]
    paths: [.github/workflows/diagnose-database-storage.yml]
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Store the verified live-container fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/unit/database-change.bats)" = ca44e913215df1825c8a5cac476fee8ae65155af
          sed -i 's/\[{Mounts:/[{State:{Running:true,Restarting:false},Mounts:/' tests/unit/database-change.bats
          test "$(git hash-object tests/unit/database-change.bats)" = edf71ef1a4b0ad5d0d6e73f382d510e84eb924dd
          jq -n --rawfile content tests/unit/database-change.bats '{content:$content,encoding:"utf-8"}' > "$RUNNER_TEMP/blob.json"
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
          test "$blob" = edf71ef1a4b0ad5d0d6e73f382d510e84eb924dd
          printf 'VERIFIED_TEST_BLOB=%s\n' "$blob"
