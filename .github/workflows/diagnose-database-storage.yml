name: Diagnose database storage
on:
  push:
    branches: [fix/website-menu-initial-focus]
    paths: [.github/workflows/diagnose-database-storage.yml]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trace the complete PostgreSQL backup and cutover sequence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/storage-diagnostic.sh" <<'SH'
          # Keep the production predicate intact; record the exact operands only
          # when it refuses publication. Do not print environment credentials.
          eval "$(declare -f joomlaDatabaseStorageStopped | sed '/printf.*Database storage is still mounted/i\            printf "BLOCKING_SOURCE=%s\\nPROTECTED_PATH=%s\\n" "$source" "$path" >&2; docker inspect "${containers[@]}" | jq '\''[.[]|{Id,Name,State:{Status:.State.Status,Running:.State.Running},Mounts}]'\'' >&2;')"
          SH
          awk '/^PHASE=real-joomla-installation/ {print "source \"$RUNNER_TEMP/storage-diagnostic.sh\""} {print}' \
            tests/integration/database-backups.sh > tests/integration/pg-diagnostic.sh
          bash -n tests/integration/pg-diagnostic.sh "$RUNNER_TEMP/storage-diagnostic.sh"
          OCTOJOOM_DB_TEST_ENGINE=postgres timeout --signal=TERM --kill-after=30s 42m bash tests/integration/pg-diagnostic.sh
