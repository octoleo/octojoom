name: Native terminal UI
on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install native dialog
        run: |
          if ! command -v whiptail >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y whiptail
          fi
      - name: Verify native website dialogs and progress
        env:
          OCTOJOOM_TTY_ARTIFACT_DIR: ${{ runner.temp }}/native-ui-evidence
        run: bash tests/integration/website-terminal.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-evidence
          path: ${{ runner.temp }}/native-ui-evidence
          retention-days: 3
