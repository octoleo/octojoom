# Octojoom checks: every push to master or staging, and every pull request
# towards them, must pass all jobs before it is merged.
#
# The same file also runs on Gitea Actions (it reads .github/workflows).
# The macOS and Windows jobs need runners with the macos-latest and
# windows-latest labels there.

name: Tests

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK_VERSION: v0.10.0

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -sSL --fail "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Lint the script
        run: shellcheck src/octojoom

      - name: Lint the tests
        run: |
          shellcheck -x tests/run.sh tests/test-clone.sh tests/test-clone-flow.sh tests/integration/clone.sh tests/integration/migration.sh tests/integration/v4.sh tests/integration/v4-migration.sh \
            tests/helpers/common.bash tests/helpers/stub-lib.bash tests/helpers/bin/*
          find tests -path tests/.cache -prune -o -name '*.bats' -print0 | xargs -0 shellcheck -s bash

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Bash 4 or newer (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! bash -c '[ "${BASH_VERSINFO[0]}" -ge 4 ]'; then
            brew install bash
          fi
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            case "${RUNNER_OS}" in
              Linux) sudo apt-get update && sudo apt-get install -y jq ;;
              macOS) brew install jq ;;
              Windows) choco install jq -y --no-progress ;;
            esac
          fi
          jq --version

      - name: Ensure native Docker Compose CLI is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Only the client is needed: this job never starts a Docker daemon.
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $clientRoot = Join-Path $env:RUNNER_TEMP 'octojoom-docker-cli'
            $archive = Join-Path $env:RUNNER_TEMP 'docker-cli.zip'
            Invoke-WebRequest 'https://download.docker.com/win/static/stable/x86_64/docker-29.6.2.zip' -OutFile $archive
            Expand-Archive $archive -DestinationPath $clientRoot -Force
            $clientBin = Join-Path $clientRoot 'docker'
            $env:PATH = "$clientBin;$env:PATH"
            Add-Content $env:GITHUB_PATH $clientBin
          }
          docker --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Docker CLI is unavailable.' }
          docker compose version
          if ($LASTEXITCODE -ne 0) {
            $pluginDir = Join-Path $env:USERPROFILE '.docker/cli-plugins'
            New-Item -ItemType Directory -Force $pluginDir | Out-Null
            $plugin = Join-Path $pluginDir 'docker-compose.exe'
            Invoke-WebRequest 'https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-windows-x86_64.exe' -OutFile $plugin
            if ((Get-FileHash $plugin -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4c864dd7f879dd40366e087e68a8a02cbcf018be0128867b13369898e67e1532') {
              throw 'Docker Compose download checksum mismatch.'
            }
          }
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw 'Native Docker Compose CLI is unavailable.' }

      - name: Require native Windows symbolic links
        if: runner.os == 'Windows'
        run: |
          export MSYS="${MSYS:+$MSYS }winsymlinks:nativestrict"
          link_probe=$(mktemp -d)
          trap 'rm -rf "$link_probe"' EXIT
          mkdir "$link_probe/target"
          ln -s "$link_probe/target" "$link_probe/link"
          test -L "$link_probe/link"
          printf 'MSYS=%s\n' "$MSYS" >> "$GITHUB_ENV"

      - name: Show the tools under test
        run: |
          bash --version | head -n 1
          echo "OSTYPE=${OSTYPE}"
          sed --version 2>/dev/null | head -n 1 || echo "sed: BSD"

      - name: Validate native Windows Compose host paths
        if: runner.os == 'Windows'
        env:
          OCTOJOOM_NO_REAL_DOCKER: '1'
          OCTOJOOM_REQUIRE_NATIVE_COMPOSE: '1'
        run: bash tests/run.sh --filter 'native Windows Compose resolves' tests/unit/v4-runtime.bats

      - name: Validate native Windows large JSON transport
        if: runner.os == 'Windows'
        env:
          OCTOJOOM_NO_REAL_DOCKER: '1'
        run: bash tests/run.sh --filter 'large requests|large JSON|structured results stream|large query results|metadata beyond native' tests/unit/v4-cli.bats tests/unit/v4-database.bats

      - name: Run the test suite
        env:
          # Keep legacy daemon checks Linux-only; the Windows config check is separate.
          OCTOJOOM_NO_REAL_DOCKER: ${{ runner.os != 'Linux' && '1' || '' }}
          OCTOJOOM_REQUIRE_NATIVE_COMPOSE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: bash tests/run.sh

  docker-integration:
    name: Docker clone integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exercise the real Joomla/MariaDB clone lifecycle
        # The inner deadline leaves time for the script's labeled-resource cleanup.
        run: timeout --signal=TERM --kill-after=30s 12m bash tests/integration/clone.sh

  migration-integration:
    name: Docker migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exercise source packaging and destination realignment with real databases
        run: timeout --signal=TERM --kill-after=30s 12m bash tests/integration/migration.sh

  v4-integration:
    name: OctoJoom 4.0 workflow (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, mysql, postgres, migration]
    steps:
      - uses: actions/checkout@v4
      - name: Install archive and local certificate tools
        run: sudo apt-get update && sudo apt-get install -y jq zip unzip mkcert libnss3-tools openssh-server rsync
      - name: Exercise real Joomla environments and recovery
        env:
          V4_SCENARIO: ${{ matrix.scenario }}
        run: timeout --signal=TERM --kill-after=30s 32m bash tests/integration/v4.sh
