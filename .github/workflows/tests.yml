# Gitea Actions also reads this workflow from .github/workflows.
# The macOS and Windows jobs need runners with the macos-latest and
# windows-latest labels there.

name: Tests

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLCHECK_VERSION: v0.10.0

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -sSL --fail "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Lint the script
        run: shellcheck src/octojoom

      - name: Lint the tests
        run: |
          shellcheck -x tests/run.sh tests/test-clone.sh tests/test-clone-flow.sh tests/integration/*.sh \
            tests/helpers/common.bash tests/helpers/stub-lib.bash tests/helpers/bin/*
          find tests -path tests/.cache -prune -o -name '*.bats' -print0 | xargs -0 shellcheck -s bash

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 60 || matrix.os == 'ubuntu-latest' && 30 || 12 }}
    env:
      FULL_SUITE: ${{ matrix.os == 'ubuntu-latest' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      OCTOJOOM_NO_REAL_DOCKER: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Bash 4 or newer (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! bash -c '[ "${BASH_VERSINFO[0]}" -ge 4 ]'; then
            brew install bash
          fi
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"

      - name: Show the tools under test
        run: |
          bash --version | head -n 1
          echo "OSTYPE=${OSTYPE}"
          sed --version 2>/dev/null | head -n 1 || echo "sed: BSD"

      - name: Run the complete shell suite
        if: env.FULL_SUITE == 'true'
        run: bash tests/run.sh

      - name: Check host tools, filesystem handling, and selected-site updates
        if: env.FULL_SUITE != 'true'
        run: |
          bash tests/run.sh \
            tests/unit/platform.bats \
            tests/unit/site-alignment.bats \
            tests/unit/webserver-docroot.bats \
            tests/unit/traefik-local-https.bats \
            tests/unit/playground-inspect.bats

      - name: Verify native PHP and JSON paths on Windows
        if: runner.os == 'Windows' && env.FULL_SUITE != 'true'
        run: >-
          bash tests/run.sh
          --filter 'PHP startup creates global defaults|native staged validation|Windows native backslashes|site JSON reader preserves native arguments'
          tests/unit/php-defaults.bats tests/unit/php-runtime.bats tests/unit/site-information.bats

  docker-integration:
    name: Docker clone integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exercise the real Joomla/MariaDB clone lifecycle
        # The inner deadline leaves time for the script's labeled-resource cleanup.
        run: timeout --signal=TERM --kill-after=30s 12m bash tests/integration/clone.sh

  migration-integration:
    name: Docker migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exercise source packaging and destination realignment with real databases
        run: timeout --signal=TERM --kill-after=30s 12m bash tests/integration/migration.sh

  php-runtime-integration:
    name: Docker PHP runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify published PHP switching and effective site settings
        run: timeout --signal=TERM --kill-after=30s 17m bash tests/integration/php-runtime.sh

  web-runtime-integration:
    name: Docker web runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify Joomla Apache and Nginx routing and document roots
        run: timeout --signal=TERM --kill-after=30s 22m bash tests/integration/web-runtime.sh

  playground-deploy-integration:
    name: Docker Playground setup and in-place import
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared ZIP import with existing bind mounts and named volumes
        run: timeout --signal=TERM --kill-after=30s 37m bash tests/integration/playground-deploy.sh

  database-backup-integration:
    name: Docker database and backups (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [mariadb, mysql, postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Verify actual database operations and independent Joomla restores
        env:
          OCTOJOOM_DB_TEST_ENGINE: ${{ matrix.engine }}
        run: timeout --signal=TERM --kill-after=30s 42m bash tests/integration/database-backups.sh

  local-trust:
    name: Local certificate trust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install mkcert (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
      - name: Install mkcert and Bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mkcert nss bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install mkcert (Windows)
        if: runner.os == 'Windows'
        run: choco install mkcert -y --no-progress
      - name: Verify native host trust and certificate hostnames
        run: bash tests/integration/local-trust.sh

  local-https:
    name: Docker local HTTPS integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install mkcert
        run: sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
      - name: Verify trusted Joomla HTTPS and connection changes
        run: timeout 17m bash tests/integration/local-https.sh
